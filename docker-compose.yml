
services:
  postgres:
    image: postgres:17
    container_name: distributor-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: distributor_user
      POSTGRES_PASSWORD: distributor_password
      POSTGRES_DB: distributor_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distributor_user -d distributor_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
